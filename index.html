<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ── TOP BAR ─────────────────────────────────────────────── -->
    <header class="topbar">
      <div class="topbar-left">
        <span id="current-date"></span>
        <span id="current-time"></span>
      </div>
      <div class="topbar-right">
        <button id="theme-toggle" title="Toggle light / dark mode">🌙</button>
      </div>
    </header>

    <!-- ── MAIN LAYOUT ───────────────────────────────────────────── -->
    <main class="dashboard">

      <!-- ── GREETING ──────────────────────────────────────────── -->
      <section class="card greeting-card">
        <h1 id="greeting-text">Good morning!</h1>
        <div class="name-row">
          <input id="name-input" type="text" placeholder="Enter your name…" maxlength="40" />
          <button id="name-save">Save</button>
        </div>
      </section>

      <!-- ── FOCUS TIMER ───────────────────────────────────────── -->
      <section class="card timer-card">
        <h2>Focus Timer</h2>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="timer-start">▶ Start</button>
          <button id="timer-stop" disabled>⏸ Stop</button>
          <button id="timer-reset">↺ Reset</button>
        </div>
        <div class="timer-custom">
          <label for="custom-minutes">Set minutes:</label>
          <input id="custom-minutes" type="number" min="1" max="120" value="25" />
          <button id="custom-apply">Apply</button>
        </div>
      </section>

      <!-- ── TO-DO LIST ────────────────────────────────────────── -->
      <section class="card todo-card">
        <h2>To-Do List</h2>
        <div class="todo-add-row">
          <input id="todo-input" type="text" placeholder="Add a new task…" maxlength="120" />
          <button id="todo-add">Add</button>
        </div>
        <ul id="todo-list"></ul>
      </section>

      <!-- ── QUICK LINKS ───────────────────────────────────────── -->
      <section class="card links-card">
        <h2>Quick Links</h2>
        <div class="link-add-row">
          <input id="link-name" type="text" placeholder="Label" maxlength="30" />
          <input id="link-url"  type="url"  placeholder="https://…" />
          <button id="link-add">Add</button>
        </div>
        <div id="links-container"></div>
      </section>

    </main>

    <script src="js/app.js"></script>
  </body>
</html>
